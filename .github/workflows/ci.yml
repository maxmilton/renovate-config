name: ci

on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RENOVATE_PLATFORM: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/.node-version
      - run: | # zizmor: ignore[adhoc-packages]
          npm install -g "renovate@${RENOVATE_VERSION}"
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.186.7
      - run: renovate-config-validator --strict
      - run: renovate-config-validator --strict default.json
      - run: renovate-config-validator --strict auto.json
      - run: renovate-config-validator --strict manual.json
